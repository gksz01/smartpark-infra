name: Validate infrastructure
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file azure/base.bicep
      - run: az bicep build --file azure/container.bicep
      - run: az bicep build --file azure/sql-network.bicep
      - run: docker build -t smartpark-gateway:check gateway
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: gkszz/smartpark-gateway:${{ github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az containerapp update --resource-group rg-pjblfinal-dev-brazilsouth-01 --name gateway --image gkszz/smartpark-gateway:${{ github.sha }} --output none
