name: smartpark
services:
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 12
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD}
      MSSQL_PID: Developer
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b >/dev/null"]
      interval: 10s
      retries: 30
      start_period: 30s
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sql: {condition: service_healthy}
    environment:
      SQL_PASSWORD: ${SQL_PASSWORD}
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P \"$$SQL_PASSWORD\" -C -Q \"IF DB_ID('smartpark') IS NULL CREATE DATABASE smartpark\" -b"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNTS}
    ports: ["127.0.0.1:10000:10000","127.0.0.1:10001:10001","127.0.0.1:10002:10002"]
    volumes: ["azurite-data:/data"]
  catalog:
    build: ../smartpark-catalog-service
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REQUIRE_SERVICE_KEY: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mongo: {condition: service_healthy}
  booking:
    build: ../smartpark-reservation-service
    environment:
      PORT: 3000
      SQL_SERVER: sql
      SQL_DATABASE: smartpark
      SQL_USER: sa
      SQL_PASSWORD: ${SQL_PASSWORD}
      SQL_ENCRYPT: 'false'
      SQL_TRUST_CERT: 'true'
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REQUIRE_SERVICE_KEY: 'true'
      CATALOG_URL: http://catalog:3000
      AZURE_STORAGE_CONNECTION_STRING: ${LOCAL_STORAGE_CONNECTION_STRING}
    depends_on:
      sql-init: {condition: service_completed_successfully}
      catalog: {condition: service_started}
      azurite: {condition: service_started}
  functions:
    build: ../smartpark-functions
    environment:
      AzureWebJobsStorage: ${LOCAL_STORAGE_CONNECTION_STRING}
      FUNCTIONS_WORKER_RUNTIME: node
      AZURE_FUNCTIONS_ENVIRONMENT: Development
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OUTBOX_DISPATCH_URL: http://bff:3000/internal/outbox/dispatch
    depends_on:
      azurite: {condition: service_started}
  bff:
    build: ../smartpark-bff
    environment:
      PORT: 3000
      CATALOG_URL: http://catalog:3000
      BOOKING_URL: http://booking:3000
      FUNCTIONS_URL: http://functions
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FRONTEND_ORIGINS: http://localhost:4173
    depends_on: [catalog,booking,functions]
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:8080"]
    volumes: ["./gateway/local.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [bff]
volumes:
  mongo-data:
  sql-data:
  azurite-data:
