limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
 listen 8080;
 server_tokens off;
 client_max_body_size 32k;
 proxy_read_timeout 90s;
 location / {
  limit_req zone=api burst=40 nodelay;
  proxy_pass http://bff:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /catalog/docs { proxy_pass http://catalog:3000/docs; }
 location /booking/docs { proxy_pass http://booking:3000/docs; }
 location /catalog/ { rewrite ^/catalog/(.*)$ /$1 break; proxy_pass http://bff:3000; }
 location /booking/ { rewrite ^/booking/(.*)$ /$1 break; proxy_pass http://bff:3000; }
}
